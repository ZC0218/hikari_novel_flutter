name: Build Hikari Novel iOS Unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.4"

  # 项目实际 Beta 版本
  DISPLAY_VERSION: "0.5.0-beta.1+13"

  # iOS 合法版本号
  IOS_VERSION: "0.5.0"
  IOS_BUILD_NUMBER: "13"

jobs:
  build-ios:
    name: Build Unsigned IPA
    runs-on: macos-26

    steps:
      # 1. 拉取源码
      - name: Checkout
        uses: actions/checkout@v7

      # 2. 安装指定 Flutter 版本
      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-sdk: true

      # 3. 检查 Flutter 环境
      - name: Flutter Doctor
        run: |
          flutter --version
          flutter doctor -v

      # 4. 开启 iOS
      - name: Enable iOS
        run: |
          flutter config --enable-ios
          flutter precache --ios

      # 5. 安装 Dart / Flutter 依赖
      - name: Flutter Pub Get
        run: |
          flutter pub get

      # 6. 构建 iOS Release
      # --no-codesign = 不进行 Apple Developer 签名
      - name: Build iOS Release
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name="${{ env.IOS_VERSION }}" \
            --build-number="${{ env.IOS_BUILD_NUMBER }}"

      # 7. 检查构建结果
      - name: Verify App
        run: |
          set -e

          APP_PATH="build/ios/iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Runner.app 不存在，iOS 构建失败"
            exit 1
          fi

          echo "===== App Info ====="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP_PATH/Info.plist"

          echo "===================="

      # 8. 打包成未签名 IPA
      - name: Package Unsigned IPA
        run: |
          set -e

          APP_PATH="build/ios/iphoneos/Runner.app"
          WORK_DIR="build/ios/unsigned-ipa"
          PAYLOAD_DIR="$WORK_DIR/Payload"

          mkdir -p "$PAYLOAD_DIR"

          cp -R "$APP_PATH" "$PAYLOAD_DIR/Runner.app"

          IPA_NAME="HikariNovel-${{ env.DISPLAY_VERSION }}-unsigned.ipa"

          cd "$WORK_DIR"

          zip -qry "$IPA_NAME" Payload

          mv "$IPA_NAME" "../../$IPA_NAME"

          echo "======================================"
          echo "IPA 已生成："
          echo "build/ios/$IPA_NAME"
          echo "======================================"

          ls -lh "../../$IPA_NAME"

      # 9. 检查 IPA 内容
      - name: Verify IPA
        run: |
          set -e

          IPA_PATH="build/ios/HikariNovel-${{ env.DISPLAY_VERSION }}-unsigned.ipa"

          if [ ! -f "$IPA_PATH" ]; then
            echo "::error::IPA 文件不存在"
            exit 1
          fi

          echo "===== IPA Contents ====="

          unzip -l "$IPA_PATH" | head -80

          echo "========================"

      # 10. 上传到 GitHub Actions Artifacts
      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: HikariNovel-${{ env.DISPLAY_VERSION }}-unsigned
          path: build/ios/HikariNovel-${{ env.DISPLAY_VERSION }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
